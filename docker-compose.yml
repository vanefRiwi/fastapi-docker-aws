services:
  db:
    image: postgres:16-alpine
    container_name: fastapi_db_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-inventario}
    ports:
      - "5432:5432"   # opcional: para conectarte desde DBeaver/pgAdmin en tu máquina
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: fastapi_app_container
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # "db" es el nombre del servicio de arriba: dentro de la red de Docker funciona como hostname
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-inventario}
      # Solo para probar POST /images en local (en AWS se usa el IAM Role, sin llaves)
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy   # espera a que Postgres acepte conexiones antes de correr Alembic

volumes:
  postgres_data:
