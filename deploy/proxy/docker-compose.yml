# EC2 #1 (subnet pública) — Nginx Proxy Manager
services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy_manager
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP  (Internet)
      - "443:443"  # HTTPS (Internet)
      - "81:81"    # Panel de administración (el Security Group lo limita a tu IP)
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

volumes:
  npm_data:
  npm_letsencrypt:
